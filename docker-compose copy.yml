name: agent_developer_alt

services:
    web:
        build:
            context: ../agent_developer
            dockerfile: Dockerfile
        image: agent-api-alt
        command: /usr/src/app/entrypoint.sh
        volumes:
            - ../agent_developer:/usr/src/app/
            - ../agent_developer/certs/:/usr/src/certs/
            - ../agent_developer/app/models:/usr/src/app/models
            - mediafiles:/usr/src/app/mediafiles
            - staticfiles:/usr/src/app/staticfiles
        ports:
            - 8001:8001
        env_file:
            - ./.env.dev
        depends_on:
            - db
            - redis
        networks:
            - net
        deploy:
            resources:
                limits:
                    memory: 64G
                reservations:
                    memory: 32G
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    db:
        image: postgres:15
        ports:
            - 5434:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=postgres
        networks:
            - net

    qdrant:
        image: qdrant/qdrant:latest
        volumes:
            - qdrant_data:/qdrant/storage
        ports:
            - 6334:6333
        environment:
            - QDRANT__SERVICE__HTTP_PORT=6333
        restart: unless-stopped
        networks:
            - net

    redis:
        image: redis:alpine
        restart: unless-stopped
        ports:
            - 6381:6379
        volumes:
            - redis_data:/data
        networks:
            - net

    celery:
        image: agent-api-alt
        entrypoint: /usr/src/app/entrypoint.sh
        command: celery -A app.core worker -l info -E --concurrency=1
        env_file:
            - ./.env.dev
        environment:
            - HF_HOME=/usr/src/app/models
        volumes:
            - ../agent_developer:/usr/src/app
            - ../agent_developer/app/models:/usr/src/app/models
            - mediafiles:/usr/src/app/mediafiles
            - staticfiles:/usr/src/app/staticfiles
        depends_on:
            - db
            - redis
            - web
            - qdrant
        networks:
            - net
        deploy:
            resources:
                reservations:
                    memory: 16G
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]

    beat:
        image: agent-api-alt
        entrypoint: /usr/src/app/entrypoint.sh
        command: celery -A app.core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
        env_file:
            - ./.env.dev
        volumes:
            - ../agent_developer:/usr/src/app
            - ../agent_developer/app/models:/usr/src/app/models
        depends_on:
            - redis
            - web
            - qdrant
        networks:
            - net
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:
    qdrant_data:
    mediafiles:
    staticfiles:

networks:
    net:
        driver: bridge
