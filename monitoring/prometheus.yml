global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'amk-agent-monitor'
    environment: 'development'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/prometheus_rules.yml

scrape_configs:
  # Django/Gunicorn metrics
  - job_name: 'django'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/api/metrics/'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'django-web'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Node exporter — host CPU / RAM / Network / Disk
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Celery exporter — worker & queue metrics
  - job_name: 'celery'
    static_configs:
      - targets: ['celery-exporter:9808']
    scrape_interval: 15s

  # OpenTelemetry Collector Prometheus exporter
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s
    scrape_timeout: 5s

  # macOS host disk (runs natively — can't get this from inside Docker)
  - job_name: 'host'
    static_configs:
      - targets: ['host.docker.internal:9101']
    scrape_interval: 5s
    scrape_timeout: 4s

  # Qdrant Vector DB
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
    scrape_interval: 30s
