server:
  http_listen_port: 3200
  grpc_listen_port: 4317

distributor:
  ring:
    kvstore:
      store: inmemory

ingester:
  max_block_duration: 5m
  lifecycler:
    ring:
      kvstore:
        store: inmemory

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks



