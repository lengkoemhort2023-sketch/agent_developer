# Production monitoring overlay.
#
# Usage (merge with your production compose):
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.prod.yml up -d
#
# Requirements on the host:
#   - NVIDIA Container Toolkit installed (for dcgm-exporter GPU access)
#   - Celery workers started with -E flag (events enabled)

services:
    prometheus:
        volumes:
            # Override dev config — Django target is web:8000 on the Docker network
            - ./docker/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro

    # Prod Promtail: discovers all Docker container logs via the Docker socket
    promtail:
        volumes:
            - ./docker/promtail/promtail.prod.yml:/etc/promtail/config.yml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        # Remove the dev log-file mount

    # Tempo: expose OTLP ports — web container sends traces here
    tempo:
        # No override needed; same image works for prod

    node-exporter:
        platform: linux/amd64

    celery-exporter:
        platform: linux/amd64

    # Langfuse — override secrets for production (use strong random values)
    langfuse:
        environment:
            - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/langfuse
            - NEXTAUTH_URL=http://${SERVER_IP:-localhost}:3002
            - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
            - SALT=${LANGFUSE_SALT}
            - TELEMETRY_ENABLED=false

    # NVIDIA RTX 5090 GPU monitoring
    dcgm-exporter:
        image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        cap_add:
            - SYS_ADMIN
        restart: unless-stopped
        networks:
            - net
