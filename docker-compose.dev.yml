name: agent_developer_dev

# Infrastructure-only compose for local macOS development.
# Run the app (web, celery, beat) natively to get MPS GPU access.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   python manage.py runserver
#   celery -A app.core worker -l info -E --concurrency=3

services:
    db:
        image: postgres:15
        ports:
            - 5433:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=postgres
        networks:
            - net
        restart: unless-stopped

    qdrant:
        image: qdrant/qdrant:latest
        ports:
            - 6333:6333
        volumes:
            - qdrant_data:/qdrant/storage
        environment:
            - QDRANT__SERVICE__HTTP_PORT=6333
        restart: unless-stopped
        networks:
            - net

    redis:
        image: redis:alpine
        ports:
            - 6380:6379
        volumes:
            - redis_data:/data
        restart: unless-stopped
        networks:
            - net

volumes:
    postgres_data:
    qdrant_data:
    redis_data:

networks:
    net:
        driver: bridge
