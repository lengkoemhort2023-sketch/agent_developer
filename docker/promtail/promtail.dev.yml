# Dev: Django runs natively — reads from the logs/ directory mounted into this container.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: django-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          env: dev
          service: amk-agent
          __path__: /logs/app.log
    pipeline_stages:
      # Extract level from [LEVELNAME] at the start of each line
      - regex:
          expression: '^\[(?P<level>[A-Z]+)'
      - labels:
          level:

  - job_name: django-security
    static_configs:
      - targets:
          - localhost
        labels:
          job: django
          env: dev
          service: docbot-security
          __path__: /logs/security.log
    pipeline_stages:
      - regex:
          expression: '^\[(?P<level>[A-Z]+)'
      - labels:
          level:
