global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Django runs in the 'web' container on the same Docker network
  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets:
          - web:8000
        labels:
          env: prod

  - job_name: celery
    static_configs:
      - targets:
          - celery-exporter:9808

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  # NVIDIA GPU metrics via DCGM exporter (RTX 5090)
  - job_name: gpu
    static_configs:
      - targets:
          - dcgm-exporter:9400
