global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Django app — runs natively in dev (host), in container in production
  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000   # dev: Django running natively on host
        labels:
          env: dev

  # Celery worker events via celery-exporter sidecar
  - job_name: celery
    static_configs:
      - targets:
          - celery-exporter:9808

  # OpenTelemetry Collector — OTLP metrics converted to Prometheus format
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  # OS-level metrics: CPU, RAM (from Docker node-exporter, limited on macOS)
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  # macOS host disk usage (runs natively — can't get this from inside Docker)
  - job_name: host
    static_configs:
      - targets:
          - host.docker.internal:9101
        labels:
          env: dev
