name: agent_developer_dev

# Infrastructure-only compose for local macOS development.
# Run the app (web, celery, beat) natively to get MPS GPU access.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   python manage.py runserver
#   celery -A app.core worker -l info -E --concurrency=3

services:
    db:
        image: postgres:15
        ports:
            - 5433:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=postgres
        networks:
            - net
        restart: unless-stopped

    qdrant:
        image: qdrant/qdrant:latest
        ports:
            - 6333:6333
        volumes:
            - qdrant_data:/qdrant/storage
        environment:
            - QDRANT__SERVICE__HTTP_PORT=6333
        restart: unless-stopped
        networks:
            - net

    redis:
        image: redis:alpine
        ports:
            - 6380:6379
        volumes:
            - redis_data:/data
        restart: unless-stopped
        networks:
            - net

    # ── Observability stack ───────────────────────────────────────────────────

    # --- Logs (Loki + Promtail) ---
    loki:
        image: grafana/loki:latest
        ports:
            - 3100:3100
        volumes:
            - ./docker/loki/loki.yml:/etc/loki/local-config.yaml:ro
            - loki_data:/loki
        command: -config.file=/etc/loki/local-config.yaml
        restart: unless-stopped
        networks:
            - net

    # Dev: reads ./logs/ where Django writes app.log and security.log
    promtail:
        image: grafana/promtail:latest
        volumes:
            - ./docker/promtail/promtail.dev.yml:/etc/promtail/config.yml:ro
            - ./logs:/logs:ro
        command: -config.file=/etc/promtail/config.yml
        depends_on:
            - loki
        restart: unless-stopped
        networks:
            - net

    # --- Traces (Tempo) ---
    tempo:
        image: grafana/tempo:latest
        ports:
            - 3200:3200   # Tempo HTTP / Grafana datasource
            - 4317:4317   # OTLP gRPC  — Django sends traces here
            - 4318:4318   # OTLP HTTP
        volumes:
            - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
            - tempo_data:/var/tempo
        command: -config.file=/etc/tempo.yaml
        restart: unless-stopped
        networks:
            - net

    # --- OpenTelemetry Collector (receives traces + metrics, routes to backends) ---
    otel-collector:
        image: otel/opentelemetry-collector-contrib:latest
        ports:
            - 5317:4317   # OTLP gRPC  — Django sends traces & metrics here
            - 5318:4318   # OTLP HTTP
            - 8889:8889   # Prometheus exporter (scraped by Prometheus)
        volumes:
            - ./docker/otel-collector/config.yml:/etc/otel-collector/config.yml:ro
        command: --config=/etc/otel-collector/config.yml
        depends_on:
            - tempo
        restart: unless-stopped
        networks:
            - net

    # --- Metrics (Prometheus) ---
    prometheus:
        image: prom/prometheus:latest
        ports:
            - 9090:9090
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
        extra_hosts:
            - host.docker.internal:host-gateway
        restart: unless-stopped
        networks:
            - net

    grafana:
        image: grafana/grafana:latest
        ports:
            - 3001:3000
        volumes:
            - grafana_data:/var/lib/grafana
            - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
        depends_on:
            - prometheus
        restart: unless-stopped
        networks:
            - net

    node-exporter:
        image: prom/node-exporter:latest
        pid: host
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
        restart: unless-stopped
        networks:
            - net

    # LLM observability — tracks every prompt, response, and token usage.
    # Access UI at http://localhost:3002  (create account on first run)
    langfuse:
        image: langfuse/langfuse:2
        ports:
            - 3002:3000
        environment:
            - DATABASE_URL=postgresql://postgres:postgres@db:5432/langfuse
            - NEXTAUTH_URL=http://localhost:3002
            - NEXTAUTH_SECRET=docbot-langfuse-secret-change-in-prod
            - SALT=docbot-langfuse-salt-change-in-prod
            - TELEMETRY_ENABLED=false
        depends_on:
            - db
        restart: unless-stopped
        networks:
            - net

    # Scrapes Celery task events from the Redis broker.
    # Requires celery workers started with -E (events enabled).
    celery-exporter:
        image: danihodovic/celery-exporter:latest
        platform: linux/amd64
        environment:
            - CE_BROKER_URL=redis://redis:6379/0
        depends_on:
            - redis
        restart: unless-stopped
        networks:
            - net

volumes:
    postgres_data:
    qdrant_data:
    redis_data:
    prometheus_data:
    grafana_data:
    loki_data:
    tempo_data:

networks:
    net:
        driver: bridge
